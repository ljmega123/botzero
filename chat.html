<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zero AI Core | Chat Imersivo</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest" defer></script>
</head>
<body class="fade-in">
    <div class="app-shell">
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-icon"><i data-lucide="bot"></i></div>
                <div class="brand-name">Zero<span style="color:var(--primary)">AI</span></div>
            </div>

            <div class="nav-group">
                <a href="index.html" class="nav-link">
                    <i data-lucide="layout-dashboard"></i> Dashboard
                </a>
                <a href="chat.html" class="nav-link active">
                    <i data-lucide="message-square"></i> Chat AI
                </a>
            </div>

            <div class="nav-divider"></div>

            <div class="nav-group">
                <span class="nav-label">Atalhos</span>
                <a href="https://web.whatsapp.com/" target="_blank" class="nav-link">
                    <i data-lucide="message-circle"></i> WhatsApp
                </a>
                <a href="https://www.canva.com" target="_blank" class="nav-link">
                    <i data-lucide="palette"></i> Canva
                </a>
            </div>

            <div class="nav-divider"></div>

            <div class="nav-group">
                <div class="nav-link" onclick="location.reload()" style="cursor:pointer">
                    <i data-lucide="plus-circle"></i> Novo Chat
                </div>
                <div class="nav-link" onclick="clearOutput()" style="cursor:pointer">
                    <i data-lucide="trash-2"></i> Limpar Console
                </div>
            </div>
        </aside>

        <main class="main-stage">
            <header class="workspace-header">
                <div class="header-content">
                    <h1 class="page-title">Assistente de Marketing</h1>
                </div>
                <div class="stat-group">
                    <div class="stat-chip">
                        <div class="dot active"></div>
                        <span id="ai-model-display">Carregando...</span>
                    </div>
                </div>
            </header>

            <div class="chat-layout">
                <div class="chat-main-area" id="gen-output">
                    <div class="gen-placeholder" id="gen-placeholder">
                        <i data-lucide="sparkles" style="width:50px;height:50px; color:var(--primary); margin-bottom:20px;"></i>
                        <h2>Terminal de Automação</h2>
                        <p>Diga o que você precisa criar hoje.</p>
                    </div>
                </div>
            </div>
            
            <div class="chat-input-area">
                <div style="max-width: 800px; margin: 0 auto; padding: 20px;">
                    <div class="chat-input-box">
                        <textarea id="custom-prompt" placeholder="Digite seu comando..." rows="1" 
                                  onkeypress="if(event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); generateCustom(); }"></textarea>
                        <button class="icon-btn primary" onclick="generateCustom()">
                            <i data-lucide="play"></i>
                        </button>
                    </div>
                </div>
            </div>

            <div class="gen-actions" id="gen-actions" style="display:none; position: fixed; bottom: 120px; left: 50%; transform: translateX(-50%);">
                <button class="btn-primary" onclick="copyOutput()">
                    <i data-lucide="copy"></i> Copiar
                </button>
            </div>
        </main>
    </div>

    <div id="toast"></div>

    <script type="module" src="main.js"></script>
    <script>
        window.addEventListener('load', () => {
            if (typeof lucide !== 'undefined') lucide.createIcons();
            const model = localStorage.getItem('czd_ai_model') || 'LLaMA-3.1';
            document.getElementById('ai-model-display').textContent = model.replace('llama-', 'LLaMA ');
        });
    </script>
</body>
</html>
